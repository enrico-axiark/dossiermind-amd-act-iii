        "400": {description: Invalid period, requirements, evidence or missing review confirmation}
        "403": {description: Live client access denied}
        "404": {description: Checklist unavailable}
        "409": {description: Revision conflict}
        "413": {description: Checklist or history size limit}
    put:
      operationId: reviseChecklist
      description: Explicit human requirements with encrypted revisions; evidence from live original fragments. Reviewed items require explicit confirmation, except unchanged previously recorded reviews. Deletion of any historically linked original purges the entire checklist and its history.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, periodStart, periodEnd, items]
              properties:
                title: {type: string, minLength: 1, maxLength: 160}
                periodStart: {type: string, format: date}
                periodEnd: {type: string, format: date}
                expectedVersion: {type: integer, minimum: 0}
                confirmHumanReview: {type: boolean}
                items:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required: [requirement, status, references]
                    properties:
                      id: {type: string, maxLength: 80}
                      requirement: {type: string, minLength: 1, maxLength: 500}
                      status: {type: string, enum: [missing, received, reviewed]}
                      references:
                        type: array
                        maxItems: 10
                        items:
                          type: object
                          required: [documentId, fragmentId]
                          properties:
                            documentId: {type: string}
                            fragmentId: {type: string}
      responses:
        "200":
          description: Attributed versioned checklist or list; current source changes downgrade item state to needs_review
        "400": {description: Invalid period, requirements, evidence or missing review confirmation}
        "403": {description: Live client access denied}
        "404": {description: Checklist unavailable}
        "409": {description: Revision conflict}
        "413": {description: Checklist or history size limit}

  /tenants/{tenantId}/brain/assertions:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      summary: Human sourced assertions with current source state and possible differences
      description: Requires live documents:read. These are attributed human statements, not independent evidence or model output.
      responses:
        '200': { description: Current assertions including conditional effectiveStatus }
        '403': { description: No live permission }
    post:
      summary: Create an encrypted sourced human assertion
      description: Requires live documents:read and documents:write and registered human membership. Origin and confidence are server controlled.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HumanAssertionInput' }
      responses:
        '201': { description: Attributed version with confidence null and contract_version 1.1.0 }
        '400': { description: Invalid content or evidence or missing review confirmation }
        '403': { description: No live permission }
  /tenants/{tenantId}/brain/assertions/{assertionId}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: assertionId
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Historical human assertion revisions
      responses:
        '200': { description: Historical attributed revisions; current source validation is provided by the list endpoint }
        '404': { description: Unavailable in this tenant }
    put:
      summary: Revise or review an assertion with optimistic version control
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HumanAssertionInput' }
      responses:
        '200': { description: New encrypted revision; approval requires explicit human confirmation on every revision }
        '400': { description: Invalid review or source }
        '403': { description: No live permission }
        '404': { description: Unavailable in this tenant }
        '409': { description: Revision conflict }

  /tenants/{tenantId}/advisor/requests:
    parameters:
      - $ref: "#/components/parameters/TenantId"
    get:
      summary: List encrypted Advisor history and actual gateway readiness
      responses:
        "200": { description: Client-scoped data array; configured is not hardware proof }
        "403": { description: Live client read permission required }
    post:
      summary: Queue a persistent client Advisor question
      description: Requires live user membership with jobs write and documents read. Input and output are encrypted. Disabled inference leaves requests queued. Expired running requests become uncertain and are never automatically replayed. Exact quotation checks do not validate business entailment. Selected calculations are deterministic derived results from one source, without period-completeness or payment claims.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [question]
              properties:
                question: { type: string, minLength: 2, maxLength: 500 }
                context: { type: string, maxLength: 2000 }
                period:
                  type: object
                  additionalProperties: false
                  required: [start, end]
                  properties:
                    start: { type: string, format: date }
                    end: { type: string, format: date }
                contributions:
                  type: array
                  maxItems: 4
                  items:
                    type: object
                    additionalProperties: false
                    required: [kind, id]
                    properties:
                      kind: { type: string, enum: [note, assertion, checklist, wiki] }
                      id: { type: string, maxLength: 120 }
                calculationIds:
                  type: array
                  maxItems: 2
                  uniqueItems: true
                  items: { type: string, maxLength: 120 }
      responses:
        "202": { description: Stored request; no guarantee inference was executed }
        "400": { description: Invalid question, context, dates or selected calculations }
        "403": { description: Live write/read permission required }
        "409": { description: Calculation/source is stale }
  /tenants/{tenantId}/advisor/requests/{advisorId}:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - name: advisorId
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Read a client request and any historical answer with stale flags
      responses:
        "200": { description: Request and encrypted answer decoded for an authorized reader }
        "403": { description: Live read permission required }
        "404": { description: Request unavailable }
    delete:
      summary: Cancel a queued or running request
      description: Cancellation prevents publication; a dispatched call may still consume provider quota. No automatic refund or retry.
      responses:
        "200": { description: Current terminal or cancelled request state }
        "403": { description: Live jobs write and read permission required }
        "404": { description: Request unavailable }
  /tenants/{tenantId}/advisor/contributions:
    parameters:
      - $ref: "#/components/parameters/TenantId"
    get:
      summary: List attributed human contributions available for explicit selection
      description: Notes, non-rejected current assertions and explicit checklists are human/derived context, never independent original evidence. Changed revisions invalidate a queued answer.
      responses:
        "200": { description: Client-scoped contribution options }
        "403": { description: Live documents read permission required }
  /tenants/{tenantId}/advisor/requests/{advisorId}/review:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - name: advisorId
        in: path
        required: true
        schema: { type: string }
    put:
      summary: Record an attributed encrypted human review of a completed current answer
      description: Review is human confirmation, not measured model accuracy or proof of truth. All revisions are exported and deleted with the source-linked job.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status, comment, expectedVersion, confirmHumanReview]
              properties:
                status: { type: string, enum: [approved, rejected, needs_review] }
                comment: { type: string, minLength: 1, maxLength: 2000 }
                expectedVersion: { type: integer, minimum: 0 }
                confirmHumanReview: { type: boolean, enum: [true] }
      responses:
        "200": { description: Attributed current review and encrypted review history }
        "400": { description: Explicit confirmation or bounded comment missing }
        "403": { description: Live documents read and write permission required }
        "409": { description: Answer unavailable, stale or review version conflict }
  /tenants/{tenantId}/brain/memory:
    parameters:
      - $ref: "#/components/parameters/TenantId"
    get:
      summary: List client wiki proposals and gateway readiness
      responses:
        "200": { description: Source-state and bounded-coverage metadata; model proposals pending human review }
        "403": { description: Live client read permission required }
    post:
      summary: Queue document classification and wiki proposal from extracted original text
      description: Input/output encrypted; stable dispatch ID; expired running jobs uncertain without retry. Up to twelve original passages and 24000 characters. Exact quotes and entity co-occurrence do not prove semantics. Disabled AMD leaves requests queued; no simulation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [documentId]
                  properties:
                    documentId: { type: string }
                - type: object
                  additionalProperties: false
                  required: [kind, documentId, page]
                  properties:
                    kind: { type: string, enum: [vision] }
                    documentId: { type: string }
                    page: { type: integer, minimum: 1, maximum: 50 }
                - type: object
                  additionalProperties: false
                  required: [kind, transcriptionId]
                  properties:
                    kind: { type: string, enum: [wiki_from_vision] }
                    transcriptionId: { type: string }
              description: Reviewed visual transcription remains model-derived text. Only current approved non-ambiguous blocks can feed wiki, search and Advisor. Later review changes invalidate downstream outputs; original page/bbox lineage retained.
      responses:
        "202": { description: Persisted queued request }
        "400": { description: Invalid document selection }
        "403": { description: Live read and jobs write permission required }
        "409": { description: Original not extracted, empty or inconsistent }
  /tenants/{tenantId}/brain/memory/{memoryId}:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - name: memoryId
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Read source-linked wiki proposal or pending request
      responses:
        "200": { description: Authorized client request }
        "403": { description: Live client read permission required }
        "404": { description: Request unavailable }
    delete:
      summary: Cancel queued or running wiki request
      responses:
        "200": { description: Current request state; dispatched call may consume provider quota }
        "403": { description: Live jobs write and read permission required }
  /tenants/{tenantId}/brain/memory/{memoryId}/review:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - name: memoryId
        in: path
        required: true
        schema: { type: string }
    put:
      summary: Record an attributed human review of a current completed wiki
      description: Requires documents read and write. Review history encrypted, optimistic and source-linked. Approval does not turn a model proposal into independent evidence or measured truth. Only approved current wiki proposals are offered as explicit Advisor context and in derived wiki search.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status, comment, expectedVersion, confirmHumanReview]
              properties:
                status: { type: string, enum: [approved, rejected, needs_review] }
                comment: { type: string, minLength: 1, maxLength: 2000 }
                expectedVersion: { type: integer, minimum: 0 }
                confirmHumanReview: { type: boolean, enum: [true] }
      responses:
        "200": { description: Current review and full attributed history }
        "400": { description: Confirmation or bounded comment missing }
        "403": { description: Live read/write permission required }
        "409": { description: Wiki/source stale, pending or review version changed }
  /tenants/{tenantId}/brain/memory/{memoryId}/page:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - name: memoryId
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Read canonical original page for comparing a visual transcription
      description: Locally rasterized PNG, not AI. Live read permission/epoch and original hash checked before and after preparation. No persisted plaintext page or remote image URL.
      responses:
        "200":
          description: Bounded PNG preview
          content:
            image/png:
              schema: { type: string, format: binary }
        "403": { description: Authorization unavailable or changed }
        "404": { description: Request unavailable }
        "409": { description: Original changed or unsupported }
components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://identity.example.com/.well-known/openid-configuration
  parameters:
    TenantId:
      name: tenantId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Unauthorized:
      description: Missing, expired or invalid access token
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    Forbidden:
      description: Tenant membership or scope is insufficient
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    NotFound:
      description: Resource not found in the authorized tenant
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    Conflict:
      description: Resource state or idempotency conflict
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    TooLarge:
      description: Upload exceeds configured limit
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
  schemas:
    HumanAssertionInput:
      type: object
      required: [subject, predicate, value, context, references]
      properties:
        subject: { type: string, minLength: 1, maxLength: 160 }
        predicate: { type: string, minLength: 1, maxLength: 160 }
        value: { type: string, minLength: 1, maxLength: 2000 }
        context: { type: string, minLength: 1, maxLength: 160, description: Human-declared grouping context; no automatic entity resolution }
        status: { enum: [proposed, verified, rejected], default: proposed }
        expectedVersion: { type: integer, minimum: 0 }
        confirmHumanReview: { type: boolean, description: Required for verified or rejected; this records a human decision, not measured accuracy }
        references:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            required: [documentId, fragmentId]
            properties:
              documentId: { type: string }
              fragmentId: { type: string }
    Principal:
      type: object
      required: [id, type, role, scopes]
      properties:
        id: { type: string }
        type: { type: string, enum: [user, service] }
        role: { type: string }
        scopes: { type: array, items: { type: string } }
    OrganizationCreate:
      type: object
      required: [name, type]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        type: { type: string, enum: [studio, pmi, partner, platform] }
    Organization:
      allOf:
        - $ref: "#/components/schemas/OrganizationCreate"
        - type: object
          required: [id, createdAt]
          properties:
            id: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }
    UserCreate:
      type: object
      required: [id, email, displayName]
      properties:
        id: { type: string, description: OIDC subject }
        email: { type: string, format: email }
        displayName: { type: string }
    User:
      allOf:
        - $ref: "#/components/schemas/UserCreate"
        - type: object
          properties: { createdAt: { type: string, format: date-time } }
    TenantCreate:
      type: object
      required: [organizationId, name]
      properties:
        organizationId: { type: string, format: uuid }
        externalId: { type: [string, "null"] }
        name: { type: string }
        region: { type: string, default: eu }
        retentionDays: { type: integer, minimum: 1, default: 365 }
    Tenant:
      type: object
      required: [id, organizationId, name, status, region, retentionDays, createdAt]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        externalId: { type: [string, "null"] }
        name: { type: string }
        status: { type: string, enum: [active, restricted, suspended, erased] }
        region: { type: string }
        retentionDays: { type: integer }
        createdAt: { type: string, format: date-time }
    MembershipUpsert:
      type: object
      required: [userId, role, scopes]
      properties:
        userId: { type: string }
        role: { type: string }
        scopes: { type: array, items: { type: string } }
    Membership:
      allOf:
        - $ref: "#/components/schemas/MembershipUpsert"
        - type: object
          properties: { tenantId: { type: string, format: uuid } }
    Document:
      type: object
      required: [id, tenantId, filename, mimeType, sizeBytes, sha256, status, createdBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        filename: { type: string }
        mimeType: { type: string }
        sizeBytes: { type: integer }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        status: { type: string }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        deletedAt: { type: [string, "null"], format: date-time }
    Job:
      type: object
      required: [id, tenantId, type, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        type: { type: string }
        status: { type: string, enum: [queued, running, completed, completed_with_errors, failed, cancelled] }
        input: { type: object, additionalProperties: true }
        output: { type: [object, "null"], additionalProperties: true }
        createdAt: { type: string, format: date-time }
        completedAt: { type: [string, "null"], format: date-time }
    AuditEvent:
      type: object
      required: [id, tenantId, actorId, actorType, action, metadata, eventHash, createdAt]
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string }
        actorId: { type: string }
        actorType: { type: string }
        action: { type: string }
        targetType: { type: [string, "null"] }
        targetId: { type: [string, "null"] }
        metadata: { type: object, additionalProperties: true }
        previousEventHash: { type: [string, "null"] }
        eventHash: { type: string }
        createdAt: { type: string, format: date-time }
    PrivacyExport:
      type: object
      required: [requestId, manifestSha256, payload]
      properties:
        requestId: { type: string, format: uuid }
        manifestSha256: { type: string }
        payload: { type: object, additionalProperties: true }
    ErasureReceipt:
      type: object
      required: [requestId, resultHash, documentsDeleted, erasedAt]
      properties:
        requestId: { type: string, format: uuid }
        resultHash: { type: string }
        documentsDeleted: { type: integer }
        erasedAt: { type: string, format: date-time }
    ExternalMapping:
      type: object
      required: [partnerClientId, resourceType, externalId, internalId]
      properties:
        partnerClientId: { type: string, format: uuid }
        tenantId: { type: string, format: uuid, readOnly: true }
        resourceType: { type: string, examples: [customer, document, report] }
        externalId: { type: string }
        internalId: { type: string }
        createdAt: { type: string, format: date-time, readOnly: true }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string }
            message: { type: string }
